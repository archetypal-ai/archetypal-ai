<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" fill="none">
  <defs>
    <!-- Gradient for the ◎ glyph — warm to cool -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="35%" stop-color="#F87171"/>
      <stop offset="65%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <!-- Gradient for triangle -->
    <linearGradient id="triGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <!-- Gradient for bars -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <!-- ◎ Symbol — The Civilization Glyph -->
  <circle cx="60" cy="62" r="44" stroke="url(#glyphGrad)" stroke-width="5.5" fill="none"/>
  <circle cx="60" cy="62" r="23" stroke="url(#glyphGrad)" stroke-width="4" fill="none"/>
  <circle cx="60" cy="62" r="7" fill="url(#glyphGrad)"/>

  <!-- △ The Archetype -->
  <polygon points="125,102 158,28 191,102" stroke="url(#triGrad)" stroke-width="4.5" fill="none" stroke-linejoin="round"/>

  <!-- Rising bars — Skill evolution -->
  <rect x="207" y="78" width="11" height="24" rx="2.5" fill="#22D3EE" opacity="0.5"/>
  <rect x="224" y="60" width="11" height="42" rx="2.5" fill="#A78BFA" opacity="0.65"/>
  <rect x="241" y="42" width="11" height="60" rx="2.5" fill="#F472B6" opacity="0.8"/>
  <rect x="258" y="22" width="11" height="80" rx="2.5" fill="url(#barGrad)"/>

  <!-- Text: ARCHETYPAL -->
  <text x="288" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif" font-size="32" font-weight="800" fill="#F1F5F9" letter-spacing="2">ARCHETYPAL</text>
  <!-- Text: AI -->
  <text x="288" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif" font-size="24" font-weight="300" fill="#94A3B8" letter-spacing="6">AI</text>

  <!-- Slogan -->
  <text x="288" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif" font-size="11" font-weight="400" fill="#64748B" letter-spacing="2.5">WHERE INTELLIGENCE COMES ALIVE</text>
</svg>
